# Panda Breath Klipper integration
# Generated by install.sh. Edit values here, then restart Klipper.

[panda_breath]
firmware: stock
host: 192.168.4.30
port: 80

[heater_generic panda_breath]
heater_pin: panda_breath:pwm
sensor_type: panda_breath
control: watermark
max_delta: 0.5
min_temp: 15
max_temp: 80

[verify_heater panda_breath]
check_gain_time: 360
hysteresis: 5
heating_gain: 1

[gcode_macro M141]
description: Set chamber temperature (heat with Klipper, hold/cool with Panda auto)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set current = printer["heater_generic panda_breath"].temperature|float %}
    {% set tolerance = 0.5 %}
    {% set filtertemp = params.FILTERTEMP|default(30)|int %}
    {% set hotbedtemp = params.HOTBEDTEMP|default(30)|int %}
    {% if s <= 0 %}
        PANDA_BREATH_AUTO ENABLE=0
        SET_HEATER_TEMPERATURE HEATER="panda_breath" TARGET=0
    {% elif s > (current + tolerance) %}
        SET_HEATER_TEMPERATURE HEATER="panda_breath" TARGET={s}
    {% else %}
        PANDA_BREATH_AUTO ENABLE=1 TARGET={s} FILTERTEMP={filtertemp} HOTBEDTEMP={hotbedtemp}
    {% endif %}

[gcode_macro M191]
description: Reach and hold chamber temperature; bed boost to 100C only for chamber targets above BOOST_ABOVE (default 50)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set current = printer["heater_generic panda_breath"].temperature|float %}
    {% set tolerance = 0.5 %}
    {% set margin = params.MARGIN|default(0)|float %}
    {% set boost_above = params.BOOST_ABOVE|default(50)|float %}
    {% set filtertemp = params.FILTERTEMP|default(30)|int %}
    {% set hotbedtemp = params.HOTBEDTEMP|default(30)|int %}
    {% if s <= 0 %}
        M141 S0
    {% elif (current + tolerance) < s %}
        SET_HEATER_TEMPERATURE HEATER="panda_breath" TARGET={s}
        {% if s > boost_above and current < (s - margin) %}
            # Boost: bed radiation speeds the chamber rise (27->60C: ~18 min with
            # the bed at 100C to the end; ~28 min if it drops at 55C, ~30 min at 60C
            # throughout). Only for high chamber targets: at 45C the boost saves
            # ~2-3 min (the bed needs 5 min just to reach 100C) but leaves a PA bed
            # at ~70C for the first layer (2026-10-16). Below BOOST_ABOVE the bed
            # sits at the chamber target instead.
            M140 S100
            RESPOND MSG="Chamber pre-heat: bed at 100C until chamber reaches {s - margin}C"
            TEMPERATURE_WAIT SENSOR="heater_generic panda_breath" MINIMUM={s - margin}
        {% endif %}
        # Leave the bed at the chamber target rather than 100C. The start G-code
        # sets the filament's own bed temperature next (ASA: back to 100C at once;
        # PA: it coasts down, as a bed can't cool below a hot chamber).
        M140 S{s}
        RESPOND MSG="Chamber pre-heat: bed at {s}C (chamber target) until the start G-code sets it"
        TEMPERATURE_WAIT SENSOR="heater_generic panda_breath" MINIMUM={s}
        PANDA_BREATH_AUTO ENABLE=1 TARGET={s} FILTERTEMP={filtertemp} HOTBEDTEMP={hotbedtemp}
    {% else %}
        PANDA_BREATH_AUTO ENABLE=1 TARGET={s} FILTERTEMP={filtertemp} HOTBEDTEMP={hotbedtemp}
        TEMPERATURE_WAIT SENSOR="heater_generic panda_breath" MAXIMUM={s + tolerance}
    {% endif %}
